<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #333;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-top: 10px;
      margin-bottom: 3px;
    }
    input[type="text"] {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      box-sizing: border-box;
    }
    .hint {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }
    textarea#clipboard-preview {
      width: 100%;
      height: 100px;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
      box-sizing: border-box;
      background: #f5f5f5;
      color: #555;
      resize: vertical;
    }
    .inline-actions {
      margin-top: 8px;
      display: flex;
      justify-content: flex-end;
    }
    .inline-actions button {
      margin-top: 0;
      width: auto;
      padding: 5px 8px;
      font-size: 12px;
      background: #374151;
    }
    .inline-actions button:hover {
      background: #1f2937;
    }
    button {
      margin-top: 14px;
      width: 100%;
      padding: 8px;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #6d28d9;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      min-height: 18px;
    }
    .success { color: #16a34a; }
    .error { color: #dc2626; }
  </style>
</head>
<body>
  <h1>Clipboard to Obsidian</h1>

  <label for="clipboard-preview">クリップボードの内容</label>
  <textarea id="clipboard-preview" readonly placeholder="読み取り中..."></textarea>
  <div class="inline-actions">
    <button id="refresh-clipboard" type="button">再取得</button>
  </div>

  <label for="vault">Vault名</label>
  <input type="text" id="vault" placeholder="MyVault" value="My-Obsidian">

  <label for="folder">保存先フォルダ</label>
  <input type="text" id="folder" placeholder="Clippings" value="LearningLogs">

  <label for="type">type</label>
  <input type="text" id="type" placeholder="generativeAI-logs" value="generativeAI-logs">

  <label for="tags">タグ</label>
  <input type="text" id="tags" placeholder="生成AI, 思考整理">
  <div class="hint">カンマ区切り（空欄可）</div>

  <label for="title">ノートタイトル</label>
  <input type="text" id="title" placeholder="空欄なら日時で自動生成">

  <button id="send">Obsidianに送る</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
