<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Pomodoro Timer</title>
  <style>
    :root {
      --work: #dc2626;
      --break: #16a34a;
      --paused: #6b7280;
      --accent: var(--work);
    }
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #333;
      background: #fff;
    }
    body.widget {
      width: auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    body.phase-break { --accent: var(--break); }
    .phase {
      text-align: center;
      font-weight: 600;
      color: var(--accent);
      font-size: 14px;
    }
    .phase .status {
      color: #888;
      font-weight: normal;
      margin-left: 4px;
    }
    .time {
      text-align: center;
      font-size: 56px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin: 4px 0 12px;
      color: #111;
    }
    body.widget .time { font-size: 22vw; margin: 0 0 4vh; }
    .cycle {
      text-align: center;
      margin-bottom: 12px;
    }
    .dots {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 4px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid #d1d5db;
      box-sizing: border-box;
    }
    .dot.done { background: var(--work); border-color: var(--work); }
    .dot.current { border-color: var(--work); }
    .cycle-text { font-size: 12px; color: #555; }
    body.widget .dot { width: 14px; height: 14px; }
    body.widget .cycle-text { font-size: 14px; }
    .controls {
      display: flex;
      gap: 6px;
    }
    button {
      flex: 1;
      padding: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { filter: brightness(0.9); }
    button.secondary {
      background: #374151;
      flex: 0 0 auto;
      font-size: 12px;
    }
    .today {
      margin-top: 12px;
      text-align: center;
      color: #555;
    }
    .links {
      margin-top: 10px;
      display: flex;
      gap: 6px;
    }
    .links button {
      background: #f3f4f6;
      color: #333;
      font-size: 12px;
      font-weight: 500;
      padding: 6px;
    }
    body.widget #open-widget { display: none; }
    body:not(.widget) #open-pip { display: none; }
    details {
      margin-top: 10px;
      border-top: 1px solid #eee;
      padding-top: 8px;
    }
    summary { cursor: pointer; color: #555; }
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 70px;
      gap: 6px 8px;
      align-items: center;
      margin-top: 8px;
    }
    input[type="number"] {
      width: 100%;
      padding: 4px 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      box-sizing: border-box;
    }
    .sound-settings {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed #eee;
    }
    label.check { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    select {
      width: 100%;
      padding: 3px 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
    }
    input[type="range"] { width: 100%; margin: 0; }
    .sound-settings.disabled .settings-grid { opacity: 0.4; }
    #preview-sound {
      margin-top: 8px;
      width: 100%;
      background: #f3f4f6;
      color: #333;
      font-weight: 500;
    }
    #save-settings {
      margin-top: 8px;
      width: 100%;
      background: #374151;
      font-size: 12px;
    }
    .hint { font-size: 11px; color: #888; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="phase"><span id="phase-label">作業</span><span class="status" id="status-label"></span></div>
  <div class="time" id="time">25:00</div>
  <div class="cycle">
    <div class="dots" id="dots" aria-hidden="true"></div>
    <div class="cycle-text" id="cycle-text"></div>
  </div>
  <div class="controls">
    <button id="toggle">開始</button>
    <button id="reset" class="secondary" title="今のフェーズを最初から">リセット</button>
    <button id="skip" class="secondary" title="次のフェーズへ">スキップ</button>
  </div>
  <div class="today">今日の完了: <strong id="today-count">0</strong> 回</div>
  <div class="links">
    <button id="open-widget">ウィジェットで開く</button>
    <button id="open-pip" title="常に最前面に表示される小さなタイマーを開きます">最前面に表示</button>
  </div>
  <details>
    <summary>設定</summary>
    <div class="settings-grid">
      <label for="workMin">作業（分）</label><input type="number" id="workMin" min="1" max="180">
      <label for="shortBreakMin">短い休憩（分）</label><input type="number" id="shortBreakMin" min="1" max="60">
      <label for="longBreakMin">長い休憩（分）</label><input type="number" id="longBreakMin" min="1" max="120">
      <label for="longBreakInterval">長い休憩までの作業回数</label><input type="number" id="longBreakInterval" min="1" max="12">
    </div>
    <div class="sound-settings">
      <label class="check"><input type="checkbox" id="soundEnabled"> 終了時に音を鳴らす</label>
      <div class="settings-grid">
        <label for="soundType">音の種類</label>
        <select id="soundType"></select>
        <label for="soundVolume">音量 <span id="volume-value"></span></label>
        <input type="range" id="soundVolume" min="0" max="100" step="5">
      </div>
      <button id="preview-sound" class="secondary">試しに鳴らす</button>
    </div>
    <button id="save-settings">保存</button>
    <div class="hint">実行中のタイマーには、次のフェーズから反映されます。</div>
  </details>
  <script src="sound.js"></script>
  <script src="popup.js"></script>
</body>
</html>
